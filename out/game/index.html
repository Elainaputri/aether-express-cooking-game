<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Express: Grand Dining Car</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140b06; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Aether Express: Grand Dining Car. A vintage train dining car. Take a passenger's order, cook each step at the glowing brass station, release while the doneness arc is golden, plate the dish at the pass and serve it before patience runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
